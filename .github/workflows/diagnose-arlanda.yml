name: Diagnose Arlanda Express archives and OSM (no deploy)
on:
  push:
    branches: [feature/arlanda-express-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify all historical Arlanda routes trips and full OSM rail shape
        run: python -u scripts/diagnose_arlanda.py
