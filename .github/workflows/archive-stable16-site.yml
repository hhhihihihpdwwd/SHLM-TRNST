name: Archive exact publicly Chromium-verified STABLE16 complete Mälartåg five-corridor site (NO DEPLOY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-stable16-site.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable/16
          fetch-depth: 0
      - name: Confirm completed 16-system Mälartåg network development branch source is frozen
        run: test "$(git rev-parse HEAD)" = "5f9e0f0a96111367fa82944b9ca770d834abb517"
      - uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42986423014
          name: github-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _published
      - name: Verify and archive complete publicly tested website photos sprites original 10779 timetables 101 physical rail shapes and checksum manifest
        run: |
          mkdir -p website
          tar -xf _published/artifact.tar -C website
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('website')
          d=json.loads((p/'data/rail.json').read_text())
          assert len(d['trips'])==10779 and len(d['shapes'])==101
          assert d['scope'].endswith('-sj-complete-malartag-five')
          assert d['malartagFiveDailyNew']==168
          assert len([t for t in d['trips'] if t.get('malartagFiveVerified')])==168
          expected={'orebro-uppsala','nykoping','hallsberg','uven','gavle'}
          assert set(d['malartagFiveCompleteCorridors'])==expected
          for name in expected:
           assert d['malartagDirections'][name].get('forward',0)>0
           assert d['malartagDirections'][name].get('reverse',0)>0
          assert 'app.js?v=malartag-five-01' in (p/'index.html').read_text()
          for name in ('src/app.js','src/rail-data.js','src/rail-filter.js','src/photos.js',
                       'src/vehicle-front-sprites.js','src/approved-train-markers.js',
                       'src/operator-marker-sprites.js','src/vy-marker-sprite.js',
                       'src/tagab-marker-sprite.js','src/rdc-marker-sprite.js',
                       'photos/catalog.json','photos/images/rail_rdc_euronight.webp'):
           assert (p/name).is_file(),name
          original={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
                    for f in p.rglob('*') if f.is_file()}
          manifest={'sourceCommit':'5f9e0f0a96111367fa82944b9ca770d834abb517',
                    'deployedPagesRun':42986423014,
                    'successfulActualPublicChromiumRun':42986473715,
                    'historicTrains':10779,'verifiedRailShapes':101,'addedRealMalartagDepartures':168,
                    'allOriginalPublishedFiles':original}
          (p/'STABLE16-MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          print('STABLE16: EXACT PUBLIC CHROMIUM-VERIFIED 5-CORRIDOR MÄLARTÅG WEBSITE,',
                len(original),'ORIGINAL ASSETS WITH SHA256 CHECKSUMS')
          PY
      - name: Commit exact original site snapshot to new independent archive/stable16-website branch
        run: |
          git config user.name "stockholm-rail-backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c archive/stable16-website
          git add -f website
          git commit -m "archive: exact public Chrome-tested STABLE16 all five Mälartåg corridors, 10779 original timetables"
          git push origin HEAD:refs/heads/archive/stable16-website
