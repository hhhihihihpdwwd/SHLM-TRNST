name: Audit VR Snabbtåg stop-to-OSM offsets (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-vr-stop-alignment01.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vr-snabbtag-01
          path: _vr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42633083267
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: github-pages
          path: _frozen
      - name: Load already verified physical OSM rail geometry, not network candidates
        run: |
          mkdir -p _stable
          tar -xf _frozen/artifact.tar -C _stable
          python -u _vr/scripts/build_vr_candidates.py 2026-11-09
          python -u _vr/scripts/audit_vr_station_alignment.py _stable/data/rail.json _vr/data/vr_candidates.json
