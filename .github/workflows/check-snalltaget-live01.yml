name: Verify LIVE public Stockholm Rail 13 systems in Chromium after Snälltåget deploy
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-snalltaget-live01.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f194ecea014e863ed4e7df9e3c70452369704202
          path: _snall
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact browser-approved historical data for selection of real trains
        uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42771861126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: snalltaget-13-chromium-verified
          path: _site
      - name: Prove actual PUBLIC site serves latest Snälltåget JS and not cached STABLE08
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
               -H 'Cache-Control: no-cache' \
               'https://hhhihihihpdwwd.github.io/SHLM-TRNST/?snalltaget-published=01' \
               | grep -Fq 'src="./src/app.js?v=snalltaget-01"'; then
              echo 'PUBLIC GITHUB PAGES CONFIRMED: Snälltåget 13-system HTML delivered'
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo 'PUBLIC PAGE STILL SERVES STALE VERSION AFTER RETRIES'
              exit 1
            fi
            sleep 8
          done
      - name: Install genuine Chromium and headless test runner
        run: |
          cd _snall
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open actual public GitHub Pages in Chromium desktop and mobile, assert train markers
        env:
          SITE_ROOT: ${{ github.workspace }}/_site
          SMOKE_URL: https://hhhihihihpdwwd.github.io/SHLM-TRNST
        run: |
          cd _snall
          node tests/snalltaget-browser-smoke.mjs
