name: Deploy Stockholm Rail - Real Rail Preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stockholm-rail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout new rail engine (leave stable main untouched)
        uses: actions/checkout@v4
        with:
          ref: feature/rail-gtfs-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code before downloading anything
        run: |
          for file in src/*.js; do node --check "$file"; done
          python -m py_compile scripts/build_rail.py scripts/build_rail_keyless.py scripts/download_photos.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build public historical Stockholm rail timetable (no API key)
        run: python -u scripts/build_rail_keyless.py
      - name: Verify historical services and explicitly approximate geometry
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/rail.json'))
          assert x['schema']==1 and x['type']=='historical-weekday-simulation'
          assert x['counts'].get('metro',0)>0 and x['trips'] and x['shapes']
          assert all(t['shapeId'] in x['shapes'] and t['geometryQuality']=='approximate-stop-connectors' for t in x['trips'])
          assert len(x['trips'])>100
          print('Public archive rail trips:',len(x['trips']),'modes:',x['counts'])
          print('NOTICE: HISTORICAL SERVICE PATTERNS, SCHEMATIC ROUTE GEOMETRY, NOT GPS')
          PY
      - name: Install photo processing library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare local approved rail photos
        run: python -u scripts/download_photos.py
      - name: Package static preview
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R src data photos _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only successfully verified rail preview
        id: deployment
        uses: actions/deploy-pages@v4
