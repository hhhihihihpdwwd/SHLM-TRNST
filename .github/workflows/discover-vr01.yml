name: Discover VR Snabbtåg historical GTFS (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-vr01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vr-snabbtag-01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect actual Friday VR / MTRX agencies, timetables and stops
        run: |
          python -m py_compile scripts/discover_vr_archive.py
          python -u scripts/discover_vr_archive.py
