name: Verify authentic photos and new 3D icons without changing train service
on:
  push:
    branches: [assets/3d-markers-real-licensed-photos-20261117]
    paths: [.github/workflows/verify-new-train-artwork.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: archive/stable25-stockholm-rail-website
          path: _stable25_before
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare every pre-existing railway file, track, photo, JS filter and simulator to STABLE25
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          base=pathlib.Path('_stable25_before/website')
          new=pathlib.Path('website')
          changed={
           'index.html','src/app.js','src/photos.js',
           'photos/catalog.json','photos/approved.json',
          }
          added={
            'src/updated-train-markers.js',
            'photos/images/metro_c20_green_near_2026.webp',
            'photos/images/rail_rdc_euronight_near_2026.webp',
            'photos/images/rail_oresund_near.webp',
          }
          oldfiles={str(p.relative_to(base)):p for p in base.rglob('*') if p.is_file()}
          newfiles={str(p.relative_to(new)):p for p in new.rglob('*') if p.is_file()}
          assert set(newfiles)-set(oldfiles)==added,('UNEXPECTED ASSETS ADDED',set(newfiles)-set(oldfiles))
          assert set(oldfiles)-set(newfiles)==set(),('MISSING ORIGINAL ASSETS',set(oldfiles)-set(newfiles))
          actualChanged={name for name in oldfiles if oldfiles[name].read_bytes()!=newfiles[name].read_bytes()}
          assert actualChanged==changed,('Unexpected existing file edits',actualChanged)
          assert (base/'data/rail.json').read_bytes()==(new/'data/rail.json').read_bytes()
          a=json.loads((base/'data/rail.json').read_text())
          b=json.loads((new/'data/rail.json').read_text())
          assert a==b and len(a['trips'])==10827 and len(a['shapes'])==107
          oldCat=json.loads((base/'photos/catalog.json').read_text())
          newCat=json.loads((new/'photos/catalog.json').read_text())
          oldApproved=json.loads((base/'photos/approved.json').read_text())
          newApproved=json.loads((new/'photos/approved.json').read_text())
          keys={'metro_c20_green','rail_rdc_euronight','rail_oresund'}
          assert set(oldCat)==set(newCat)
          assert all(oldCat[k]==newCat[k] for k in oldCat if k not in keys)
          assert all(oldApproved[k]==newApproved[k] for k in oldApproved if k not in keys)
          assert set(newApproved)-set(oldApproved)=={'rail_rdc_euronight'}
          for key in keys:
           photo=newCat[key]
           assert photo['originalPhoto'] and photo['illustrative']
           assert photo['author'] and photo['source'].startswith('https://commons.wikimedia.org/wiki/File:')
           assert photo['license'].startswith('CC BY')
           assert (new/photo['path']).is_file()
          assert "updatedThreeTrainMarkers[operatorKey]" in (new/'src/app.js').read_text()
          print('UNCHANGED: 10827 TRAINS, 107 TRACK SHAPES, ALL OTHER IMAGES, ALL OTHER 16 SYSTEMS; 3 EXPLICITLY AUTHORIZED MARKERS + 3 GENUINE NEW PHOTO CROPS')
          PY
      - name: Check browser source
        run: |
          node --check website/src/app.js
          node --check website/src/photos.js
          node --check website/src/updated-train-markers.js
          node --check tests/real-photo-marker-browser.mjs
      - name: Install Chromium with browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Full original UX and all 16 providers with unchanged counts on mobile and desktop
        timeout-minutes: 17
        run: node --max-old-space-size=8192 tests/design-ui-browser-smoke.mjs
      - name: Test 3 actual on-map 3D markers, 3 actual original photos and all rail categories in Chromium
        timeout-minutes: 17
        run: node --max-old-space-size=8192 tests/real-photo-marker-browser.mjs
      - name: Save only fully green railway art changes; no deployment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stockholm-rail-real-photos-3d-icons-tested
          path: |
            website/
            _design_preview/
          retention-days: 7
          compression-level: 6
