name: Test Mälartåg full release source without network or deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-malartag-release-source03.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/malartag-full-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All static JS/Python tests, five-corridor test suite and graph safety
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
