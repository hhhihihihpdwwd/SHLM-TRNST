name: Publish fully Chromium-tested Mälartåg FIVE corridors as STABLE16
on:
  push:
    branches: [main]
    paths: [.github/workflows/stable16-malartag-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: stockholm-rail-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f9e0f0a96111367fa82944b9ca770d834abb517
          path: _source
      - uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42986170651
          name: stable16-five-malartag-chromium-approved
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _release
      - uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42851115094
          name: github-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _stable15
      - name: Hard verify same public STABLE15 source, all photographs, sprites and 10611 original real train schedules are byte unchanged
        run: |
          mkdir -p _original
          tar -xf _stable15/artifact.tar -C _original
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path('_original');b=Path('_release')
          allow={'index.html','src/app.js','src/rail-data.js','data/rail.json'}
          for file in a.rglob('*'):
           if not file.is_file():continue
           rel=str(file.relative_to(a));revised=b/rel
           assert revised.is_file(),('Old asset missing',rel)
           if rel not in allow:assert file.read_bytes()==revised.read_bytes(),('Old asset mutated',rel)
          old=json.loads((a/'data/rail.json').read_text())
          new=json.loads((b/'data/rail.json').read_text())
          assert len(old['trips'])==10611 and len(new['trips'])==10779
          assert len(old['shapes'])==95 and len(new['shapes'])==101
          assert new['trips'][:10611]==old['trips']
          assert all(new['shapes'][k]==v for k,v in old['shapes'].items())
          assert new['scope']==old['scope']+'-malartag-five'
          assert new['malartagFiveDailyNew']==168
          assert set(new['malartagCompleteCorridors'] if 'malartagCompleteCorridors' in new else new['malartagFiveCompleteCorridors'])=={
           'orebro-uppsala','nykoping','hallsberg','uven','gavle'}
          assert new['counts']['regional']==old['counts']['regional']+168
          assert len([t for t in new['trips'] if t.get('malartagFiveVerified')])==168
          for t in new['trips'][10611:]:
           assert t['agency']=='Mälartåg' and t['isLiveGPS'] is False and t['shapeId'] in new['shapes']
          assert 'app.js?v=malartag-five-01' in (b/'index.html').read_text()
          assert "from './rail-data.js?v=malartag-five-01'" in (b/'src/app.js').read_text()
          assert "TIMETABLE_URL='./data/rail.json?v=malartag-five-01'" in (b/'src/rail-data.js').read_text()
          print('STABLE16 DEPLOY APPROVED: FIVE MÄLARTÅG LINES, 168 VERIFIED REAL ADDITIONAL TRAINS, 10779 TOTAL, 101 RAIL SHAPES; OLD 16 SYSTEMS EXACT')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _release
  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
