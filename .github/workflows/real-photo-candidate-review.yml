name: Review licensed real train photos only (no deploy)
on:
  push:
    branches: [assets/3d-markers-real-licensed-photos-20261117]
    paths: [.github/workflows/real-photo-candidate-review.yml, scripts/review_real_photo_candidates.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Check real Wikimedia Commons photo license, download actual photo thumbnails and gallery
        run: python -u scripts/review_real_photo_candidates.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: real-cc-train-photo-candidates
          path: _real_photo_candidates/
          retention-days: 7
