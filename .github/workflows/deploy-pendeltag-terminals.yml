name: Deploy Pendeltag - Complete Terminals
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stockholm-rail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout new rail engine (leave stable main untouched)
        uses: actions/checkout@v4
        with:
          ref: fix/pendeltag-full-terminals
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code before downloading anything
        run: |
          for file in src/*.js; do node --check "$file"; done
          python -m py_compile scripts/build_rail.py scripts/build_rail_keyless.py scripts/refine_osm_routes.py scripts/pendeltag_only.py scripts/download_photos.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build public historical Stockholm rail timetable (no API key)
        run: python -u scripts/build_rail_keyless.py
      - name: Improve mapped rail routes where OSM relation matches the stops
        run: python -u scripts/refine_osm_routes.py
      - name: Reject unverified tracks and all other transport modes
        run: python -u scripts/pendeltag_only.py
      - name: Verify historical services and explicitly approximate geometry
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/rail.json'))
          assert x['schema']==1 and x['scope']=='pendeltag-only'
          assert x['trips'] and x['shapes']
          assert x['counts']['commuter']==len(x['trips'])
          assert all(t['mode']=='commuter' and t['geometryQuality']=='verified-osm-relation' and t['shapeId'] in x['shapes'] for t in x['trips'])
          uppsala=[t for t in x['trips'] if 'uppsala' in t.get('destination','').lower()]
          assert uppsala and all(
              'uppsala' in t['stops'][-1][2].lower() and t['stops'][-1][0]>=59.8
              for t in uppsala
          ), 'No complete Uppsala terminus on line 40'
          print('COMPLETE UPPSALA-BOUND TRAINS:',len(uppsala))
          print('VERIFIED PENDELTAG TRIPS:',len(x['trips']))
          print('NOTE: ARCHIVAL TIMETABLE SIMULATION, NOT LIVE POSITIONS')
          PY
      - name: Install photo processing library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare local approved rail photos
        run: python -u scripts/download_photos.py
      - name: Package static preview
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R src data photos _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only successfully verified rail preview
        id: deployment
        uses: actions/deploy-pages@v4
