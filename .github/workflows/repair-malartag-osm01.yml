name: Verify Mälartåg Eskilstuna–Uppsala realistic continuous OSM rail (NO DEPLOY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-malartag-osm01.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-wide-motion-visibility-audit-01
          path: _source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          repository: hhhihihihpdwwd/SHLM-TRNST
          run-id: 42844555219
          name: github-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _stable
      - name: Read exact stable14 data
        run: |
          mkdir -p _original
          tar -xf _stable/artifact.tar -C _original
          test -s _original/data/rail.json
      - name: Restore genuine railway-only Geofabrik PBF
        uses: actions/cache/restore@v4
        id: rail-cache
        with:
          path: _rail
          key: sj-full-network-geofabrik-20261110-01
      - name: Build fallback Sweden rail-only PBF directly from Geofabrik if no cached input
        if: steps.rail-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p _rail
          curl -fLsS --retry 3 --max-time 1400 https://download.geofabrik.de/europe/sweden-latest.osm.pbf -o /tmp/sweden.osm.pbf
          osmium tags-filter /tmp/sweden.osm.pbf w/railway=rail -o _rail/sweden-rail.osm.pbf --overwrite
      - name: Reconstruct original connected rail topology with OSMium and verify real Mälartåg speeds
        run: |
          python -m pip install osmium
          cd _source
          python -u scripts/repair_malartag_rail.py ../_original/data/rail.json ../_rail/sweden-rail.osm.pbf ../malartag-verified-geometry.json
      - uses: actions/upload-artifact@v4
        with:
          name: malartag-actual-real-osm-geometry-no-332km-detour
          path: malartag-verified-geometry.json
          if-no-files-found: error
