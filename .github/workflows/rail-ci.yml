name: Stockholm Rail - Data Integration Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and unit-test the new rail engine
        run: |
          python -m py_compile scripts/build_rail.py scripts/download_photos.py
          for file in src/*.js; do node --check "$file"; done
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
