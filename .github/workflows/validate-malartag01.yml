name: Validate Stockholm Rail - Mälartåg 01 (NO DEPLOY)
on:
  push:
    branches: [feature/malartag-01]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stockholm-rail-malartag-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout new rail engine (leave stable main untouched)
        uses: actions/checkout@v4
        with:
          ref: feature/malartag-01
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code before downloading anything
        run: |
          for file in src/*.js; do node --check "$file"; done
          python -m py_compile scripts/build_rail.py scripts/build_rail_keyless.py scripts/refine_osm_routes.py scripts/pendeltag_only.py scripts/append_tunnelbana.py scripts/append_tvarbanan.py scripts/build_tvarbanan_candidates.py scripts/audit_rail_directions.py scripts/append_local_trams.py scripts/build_local_tram_candidates.py scripts/build_sparvag_city_candidates.py scripts/append_sparvag_city.py scripts/build_roslags_candidates.py scripts/append_roslagsbanan.py scripts/build_saltsjo_candidates.py scripts/append_saltsjobanan.py scripts/build_arlanda_candidates.py scripts/append_arlanda_express.py scripts/build_malartag_candidates.py scripts/append_malartag.py scripts/download_photos.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assert sidebar and map both select lines 12 and 21
        run: |
          npm test
          grep -F "const showing=realActive.filter(v=>matchesRailFilter(v,state.filter));" src/app.js
      - name: Build public historical Stockholm rail timetable (no API key)
        run: python -u scripts/build_rail_keyless.py
      - name: Keep immutable snapshot of historic metro timetable candidates
        run: cp data/rail.json data/metro_candidates.json
      - name: Improve mapped rail routes where OSM relation matches the stops
        run: python -u scripts/refine_osm_routes.py
      - name: Reject unverified tracks and all other transport modes
        run: python -u scripts/pendeltag_only.py
      - name: Append all seven shape-verified Tunnelbana lines to Pendeltåg
        run: python -u scripts/append_tunnelbana.py
      - name: Preserve tested Pendeltåg and Tunnelbana snapshot
        run: cp data/rail.json data/rail-baseline.json
      - name: Import complete weekend Tvärbanan service window separately
        run: python -u scripts/build_tvarbanan_candidates.py
      - name: Append only verified Tvärbanan 30 and 31
        run: python -u scripts/append_tvarbanan.py
      - name: Freeze complete original STABLE 01 timetable
        run: cp data/rail.json data/stable-three-mode.json
      - name: Prepare Nockebybanan and Lidingöbanan historical timetables
        run: python -u scripts/build_local_tram_candidates.py
      - name: Append verified bidirectional local trams 12 and 21
        run: python -u scripts/append_local_trams.py
      - name: Freeze entire STABLE 02 service and verified track dataset
        run: cp data/rail.json data/stable02-snapshot.json
      - name: Build separate historical Spårväg City 7 timetable
        run: python -u scripts/build_sparvag_city_candidates.py
      - name: Verify line 7 OSM rails and append both terminal directions
        run: python -u scripts/append_sparvag_city.py
      - name: Freeze complete STABLE 03 dataset
        run: cp data/rail.json data/stable03-snapshot.json
      - name: Build separate historical Roslagsbanan schedule
        run: python -u scripts/build_roslags_candidates.py
      - name: Append OSM-verified lines 27, 28 and 29 both directions
        run: python -u scripts/append_roslagsbanan.py
      - name: Freeze entire proven STABLE 04 data
        run: cp data/rail.json data/stable04-snapshot.json
      - name: Read only current restricted Saltsjöbanan 25/26 historical railway services
        run: python -u scripts/build_saltsjo_candidates.py
      - name: Append verified OSM 25 and 26 only
        run: python -u scripts/append_saltsjobanan.py
      - name: Freeze all STABLE 05 established trips and tracks
        run: cp data/rail.json data/stable05-snapshot.json
      - name: Build isolated GTFS Arlanda Express X3 historic timetable
        run: python -u scripts/build_arlanda_candidates.py
      - name: Append fully OSM-verified route Stockholm C Arlanda Södra Arlanda Norra
        run: python -u scripts/append_arlanda_express.py
      - name: Verify historical services and explicitly approximate geometry
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/rail.json'))
          assert x['schema']==1 and x['scope']=='pendeltag-tunnelbana-tvarbanan-localtram-city7-roslags-saltsjo-arlanda'
          frozen05=json.load(open('data/stable05-snapshot.json'))
          assert x['trips'][:len(frozen05['trips'])]==frozen05['trips']
          assert all(x['shapes'][key]==val for key,val in frozen05['shapes'].items())
          assert all(x['counts'][key]==val for key,val in frozen05['counts'].items())
          assert x['metroLines']==frozen05['metroLines'] and x['tramLines']==frozen05['tramLines']
          assert x['roslagsLines']==frozen05['roslagsLines']
          assert x['saltsjoLines']==frozen05['saltsjoLines']
          assert x['arlandaDirections']['to-airport']>0 and x['arlandaDirections']['to-city']>0
          assert all(t['mode']=='express' and len(t['stops'])==3 and
                     t['vehicleModel']=='X3' and
                     'Arlanda Norra' in str(t['stops']) and 'Arlanda Södra' in str(t['stops'])
                     and 'Arlanda Central' not in str(t['stops'])
                     for t in x['trips'][len(frozen05['trips']):])
          stable04=json.load(open('data/stable04-snapshot.json'))
          assert x['trips'][:len(stable04['trips'])]==stable04['trips']
          assert all(x['shapes'][k]==v for k,v in stable04['shapes'].items())
          assert all(x['counts'][k]==v for k,v in stable04['counts'].items())
          assert x['roslagsLines']==stable04['roslagsLines']
          assert x['tramLines']==stable04['tramLines'] and x['metroLines']==stable04['metroLines']
          assert set(x['saltsjoLines'])=={'25','26'}
          assert all(x['saltsjoDirections'][line][direction]>0 for line in ('25','26') for direction in ('out','back'))
          for trip in x['trips'][len(stable04['trips']):len(frozen05['trips'])]:
              assert trip['mode']=='saltsjo' and trip['line'] in ('25','26')
              first=trip['stops'][0][2].casefold()
              last=trip['stops'][-1][2].casefold()
              names=(first,last)
              if trip['line']=='25':
                  assert any('saltsjö-järla' in n for n in names) and any('saltsjöbaden' in n for n in names)
              else:
                  assert any('igelboda' in n for n in names) and any('solsidan' in n for n in names)
              assert 'slussen' not in first and 'slussen' not in last
          stable03=json.load(open('data/stable03-snapshot.json'))
          assert x['trips'][:len(stable03['trips'])]==stable03['trips']
          assert all(x['shapes'][k]==v for k,v in stable03['shapes'].items())
          assert all(x['counts'][key]==value for key,value in stable03['counts'].items())
          assert x['tramLines']==stable03['tramLines']
          assert x['metroLines']==stable03['metroLines']
          assert set(x['roslagsLines'])=={'27','28','29'} and all(x['roslagsLines'][l]>0 for l in ('27','28','29'))
          assert all(x['roslagsDirections'][line]['out']>0 and x['roslagsDirections'][line]['back']>0 for line in ('27','28','29'))
          frozen=json.load(open('data/stable02-snapshot.json'))
          assert x['trips'][:len(frozen['trips'])]==frozen['trips']
          assert all(x['shapes'][k]==v for k,v in frozen['shapes'].items())
          assert all(x['counts'][kind]==frozen['counts'][kind] for kind in ('commuter','metro'))
          assert all(x['tramLines'][line]==frozen['tramLines'][line] for line in ('12','21','30','31'))
          assert x['city7Directions']['out']>0 and x['city7Directions']['back']>0
          assert x['trips'] and x['shapes']
          assert x['counts'].get('commuter',0)>0 and x['counts'].get('metro',0)>0
          before=json.load(open('data/rail-baseline.json'))
          assert x['trips'][:len(before['trips'])]==before['trips']
          assert all(x['shapes'][key]==shape for key,shape in before['shapes'].items())
          assert all(x['counts'][mode]==before['counts'][mode] for mode in ('commuter','metro'))
          assert set(x['tramLines'])=={'30','31','12','21','7'} and all(x['tramLines'][line]>0 for line in ('30','31','12','21'))
          stable=json.load(open('data/stable-three-mode.json'))
          assert x['trips'][:len(stable['trips'])]==stable['trips']
          assert all(x['shapes'][k]==v for k,v in stable['shapes'].items())
          assert all(x['counts'][mode]==stable['counts'][mode] for mode in ('commuter','metro'))
          assert all(x['tramLines'][line]==stable['tramLines'][line] for line in ('30','31'))
          for line in ('12','21'):
              directions=x['localTramDirections'][line]
              assert directions['out']>0 and directions['back']>0
          metro={'10','11','13','14','17','18','19'}
          assert set(x['metroLines'])==metro, 'Incomplete metro line coverage'
          assert all(t['mode'] in ('commuter','metro','tram','localrail','saltsjo','express') and t['geometryQuality']=='verified-osm-relation'
              and t['shapeId'] in x['shapes'] for t in x['trips'])
          uppsala=[t for t in x['trips'] if t['mode']=='commuter'
                   and 'uppsala' in t.get('destination','').lower()]
          assert uppsala and all('uppsala' in t['stops'][-1][2].lower()
                   and t['stops'][-1][0]>=59.8 for t in uppsala)
          print('UNMODIFIED COMMUTER TRIP COUNT:',x['counts']['commuter'])
          print('VERIFIED METRO ROUTES:',x['metroLines'])
          print('VERIFIED LOCAL TRAMWAYS:',x['tramLines'])
          print('NOTE: ARCHIVED WEEKDAY TIMES, NOT LIVE GPS')
          PY
      - name: Verify Tvärbanan exists and is renderable at Sunday midday
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          const noon=Date.parse('2026-11-08T12:47:00+01:00')/1000;
          const trams=activeRailTrips(d,noon,1000).filter(x=>x.mode==='tram');
          console.log('SUNDAY NOON VISIBLE TVÄRBANAN:',trams.length,
            trams.map(x=>x.line+':'+x.destination).slice(0,12));
          if(trams.length<2)throw Error('No visible Tvärbanan services at Sunday noon');
          JS
      - name: Refuse the empty-map regression at Sunday 12:47 for BOTH new lines
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          const midday=Date.parse('2026-11-08T12:47:00+01:00')/1000;
          const visible=activeRailTrips(d,midday,2000);
          for(const line of ['12','21']){
            const vehicles=visible.filter(t=>t.mode==='tram'&&t.line===line);
            console.log('SUNDAY LOCAL RAIL LINE',line,'RENDERABLE',vehicles.length);
            if(!vehicles.length)throw Error('No visible historical trains for line '+line);
          }
          JS
      - name: Verify City 7 renderable in four Sunday time windows
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          for(const hour of [8,12,16,20]){
            const at=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':47:00+01:00')/1000;
            const line7=activeRailTrips(d,at,3000).filter(t=>t.mode==='tram'&&String(t.line)==='7');
            const outward=line7.filter(t=>/t-centralen|sergels torg/i.test(t.stops[0][2]));
            const returning=line7.filter(t=>/waldemarsudde/i.test(t.stops[0][2]));
            console.log('CITY7 MAP VISIBLE',hour,line7.length,'out',outward.length,'return',returning.length);
            if(!line7.length)throw new Error('No visible City7 trains at '+hour);
            if([12,16].includes(hour) && (!outward.length || !returning.length))
              throw new Error('Missing City7 travel direction at '+hour);
          }
          JS
      - name: Check visible Roslagsbanan 27 28 29 in four time slots
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          for(const hour of [8,12,16,20]){
            const epoch=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':47:00+01:00')/1000;
            const active=activeRailTrips(d,epoch,3500);
            for(const line of ['27','28','29']){
              const trains=active.filter(v=>v.mode==='localrail'&&v.line===line);
              const inward=trains.filter(v=>/(?:stockholm|stockholms) östra/i.test(v.stops.at(-1)[2]));
              const outward=trains.filter(v=>/(?:stockholm|stockholms) östra/i.test(v.stops[0][2]));
              console.log('ROSLAG ON MAP',hour,line,trains.length,'in',inward.length,'out',outward.length);
              if(line!=='29'&&!trains.length)throw Error('No map-visible Roslagsbanan '+line+' at '+hour);
              // Line 29 is lower-frequency; verify both directions across full
              // archive separately rather than simultaneous at a single minute.
              if([12,16].includes(hour) && line!=='29' && (!inward.length || !outward.length))
                throw Error('Missing a Roslagsbanan direction for '+line+' at '+hour);
            }
          }
          // Sparse line 29: scan actual train positions for the whole day.
          const seen={in:0,out:0};
          for(let hour=5;hour<=23;hour++){
            for(const minute of [0,15,30,45]){
              const epoch=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')+':00+01:00')/1000;
              for(const train of activeRailTrips(d,epoch,6000).filter(v=>v.mode==='localrail'&&v.line==='29')){
                if(/(?:stockholm|stockholms) östra/i.test(train.stops.at(-1)[2]))seen.in++;
                if(/(?:stockholm|stockholms) östra/i.test(train.stops[0][2]))seen.out++;
              }
            }
          }
          console.log('ROSLAG 29 FULL-DAY MAP VISIBILITY',seen);
          if(!seen.in||!seen.out)throw Error('Roslagsbanan 29 lacks map-renderable bidirectional historical trains during day');
          JS
      - name: Confirm Saltsjöbanan map-visible vehicles at four Sunday hours
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          for(const hour of [8,12,16,20]){
            const at=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':47:00+01:00')/1000;
            const active=activeRailTrips(d,at,4000);
            for(const line of ['25','26']){
              const trains=active.filter(v=>v.mode==='saltsjo'&&String(v.line)===line);
              console.log('SALTSJO VISIBLE',hour,line,trains.length);
              if(!trains.length && !(hour===20&&line==='26'))throw Error('No Saltsjöbanan '+line+' on map at '+hour);
            }
          }
          JS
      - name: Ensure real Arlanda X3 map markers at 8 12 16 20 hours in both directions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips,railAt} from './src/rail-data.js';
          const d=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          for(const hour of [8,12,16,20]){
            const now=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':47:00+01:00')/1000;
            const trains=activeRailTrips(d,now,5000).filter(v=>v.mode==='express');
            const city=trains.filter(v=>/stockholm centralstation/i.test(v.stops.at(-1)[2]));
            const airport=trains.filter(v=>/stockholm centralstation/i.test(v.stops[0][2]));
            console.log('ARLANDA EXPRESS X3',hour,trains.length,'airport',airport.length,'city',city.length);
            if(!trains.length||!airport.length||!city.length)throw Error('Arlanda X3 map missing at '+hour);
            for(const v of trains)if(!Number.isFinite(railAt(v,now).pos?.[0]))
              throw Error('Arlanda X3 off-rail location');
          }
          JS
      - name: Verify both network directions and full Uppsala return route
        run: python -u scripts/audit_rail_directions.py
      - name: Install photo processing library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare local approved rail photos
        run: python -u scripts/download_photos.py
      - name: Confirm local approved Tvärbanan photos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.load(open('photos/catalog.json'))
          assert 'tram_a35' in catalog, 'Approved A35 Tvärbanan photograph missing'
          assert 'tram_nockeby12' in catalog and 'tram_lidingo21' in catalog and 'tram_city7' in catalog and 'local_x10p' in catalog and 'local_x15p' in catalog and 'local_saltsjo' in catalog and 'rail_arlanda' in catalog
          for key in ('tram_nockeby12','tram_lidingo21','tram_city7','local_x10p','local_x15p','local_saltsjo','rail_arlanda'):
              f=Path(catalog[key]['path'])
              assert f.is_file() and f.stat().st_size>2500, f'Missing {key} photo'
          p=Path(catalog['tram_a35']['path'])
          assert p.is_file() and p.stat().st_size>2500
          print('APPROVED TVÄRBANAN IMAGE OK:',p)
          PY
      - name: Audit every pre-existing system including screenshot regression
        run: node scripts/audit_visibility_all_systems.mjs
      - name: Freeze complete nine-system STABLE 06 before Mälartåg
        run: cp data/rail.json data/stable06-snapshot.json
      - name: Import all five official Mälartåg historical GTFS corridors
        run: python -u scripts/build_malartag_candidates.py
      - name: Require fully verified real OSM rails and both directions on all five
        run: python -u scripts/append_malartag.py
      - name: Audit all ten modes after Mälartåg append
        run: node scripts/audit_visibility_all_systems.mjs
      - name: Assert STABLE 06 immutability, five corridors, every stop and vehicle positions
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          before=json.load(open('data/stable06-snapshot.json'))
          after=json.load(open('data/rail.json'))
          expect={'orebro-uppsala','nykoping','hallsberg','uven','gavle'}
          assert after['scope']==before['scope']+'-malartag'
          assert after['trips'][:len(before['trips'])]==before['trips']
          assert all(after['shapes'][k]==v for k,v in before['shapes'].items())
          assert all(after['counts'][k]==v for k,v in before['counts'].items())
          for key in ('metroLines','tramLines','roslagsLines','saltsjoLines','arlandaDirections'):
              assert after[key]==before[key],key
          assert set(after['malartagDirections'])==expect
          for c in expect:
              assert after['malartagDirections'][c]['forward']>0
              assert after['malartagDirections'][c]['reverse']>0
          new=after['trips'][len(before['trips']):]
          assert len(new)>10 and all(t['mode']=='regional' and
              t['agency']=='Mälartåg' and t['geometryQuality']=='verified-osm-relation'
              and t['shapeId'] in after['shapes'] and len(t['stops'])>=2 for t in new)
          print('STABLE06 PRESERVED',len(before['trips']),'MÄLARTÅG VERIFIED',len(new))
          PY
      - name: Verify actual time-specific regional map marker positions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {activeRailTrips,railAt,railPathSplit} from './src/rail-data.js';
          import {matchesRailFilter} from './src/rail-filter.js';
          const data=JSON.parse(fs.readFileSync('data/rail.json','utf8'));
          const corridors=['orebro-uppsala','nykoping','hallsberg','uven','gavle'];
          const seen=new Set(),hours=[8,12,16,20],daily=[];
          for(const hour of hours){
            const stamp=Date.parse('2026-11-08T'+String(hour).padStart(2,'0')+':47:00+01:00')/1000;
            const live=activeRailTrips(data,stamp,10000).filter(t=>matchesRailFilter(t,'malartag'));
            daily.push(live.length);
            console.log('MÄLARTÅG MAP',hour,'visible',live.length);
            for(const trip of live){
              const point=railAt(trip,stamp);
              if(!point.pos.every(Number.isFinite)||!Number.isFinite(point.kmh))
                throw Error('Missing position/speed for '+trip.id);
              const route=railPathSplit(trip,point.meters);
              if(route.past.length<2||route.future.length<2)throw Error('Broken path split');
              seen.add(trip.corridor);
            }
          }
          if(daily.filter(n=>n>0).length<3)
            throw Error('Mälartåg is absent at most tested time windows');
          // A legitimate low-frequency corridor may not be running precisely
          // at minute :47. Audit the entire day in fifteen-minute windows.
          for(let h=5;h<=23;h++){
            for(const minute of [0,15,30,45]){
              const stamp=Date.parse('2026-11-08T'+String(h).padStart(2,'0')+':'+String(minute).padStart(2,'0')+':00+01:00')/1000;
              const trains=activeRailTrips(data,stamp,10000).filter(t=>matchesRailFilter(t,'malartag'));
              for(const trip of trains){
                const point=railAt(trip,stamp);
                if(!point.pos.every(Number.isFinite))throw Error('Invalid regional position');
                seen.add(trip.corridor);
              }
            }
          }
          console.log('MÄLARTÅG CORRIDORS ACTUALLY VISIBLE DURING DAY',Array.from(seen));
          for(const c of corridors)if(!seen.has(c))
            throw Error('No map-renderable Mälartåg on corridor '+c+' during full-day scan');
          JS
      - name: Verify model-correct locally licensed ER1 photo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          approved=json.load(open('photos/approved.json'))
          catalog=json.load(open('photos/catalog.json'))
          assert 'rail_malartag' in approved and 'ER1' in approved['rail_malartag']['title']
          assert 'rail_malartag' in catalog
          p=Path(catalog['rail_malartag']['path'])
          assert p.is_file() and p.stat().st_size>2500
          print('LICENSED MÄLARTÅG ER1 PHOTO VERIFIED:',p)
          PY
      - name: Verify no existing production files changed except targeted UI extension
        run: |
          node --check src/rail-data.js
          node --check src/app.js
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload validated build for review only - no deployment
        uses: actions/upload-artifact@v4
        with:
          name: malartag-review-only
          path: |
            data/rail.json
            data/stable06-snapshot.json
            photos/catalog.json
          retention-days: 7
